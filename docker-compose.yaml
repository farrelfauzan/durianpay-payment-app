services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    env_file:
      - .env
    volumes:
      - ./openapi.yaml:/app/openapi.yaml:ro
      - backend-data:/app/data

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - INTERNAL_API_URL=http://backend:8080
    depends_on:
      - backend

volumes:
  backend-data:
